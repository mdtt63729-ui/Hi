name: NeoGPT Android

# Builds the NeoGPT Android app that lives in neogpt/ and uploads an UNSIGNED
# release APK. Signing happens outside CI (apksigner + a release keystore).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'neogpt/**'
      - '.github/workflows/neogpt-android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Complete the source tree from upstream (overlay files win)
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -d neogpt/app/src/main/java ]; then
            git clone --depth 1 https://github.com/mdtt63729-ui/NeoGpt /tmp/upstream
            rm -rf /tmp/upstream/.git /tmp/upstream/.github /tmp/upstream/docs
            mkdir -p neogpt
            rsync -a --ignore-existing /tmp/upstream/ neogpt/
          fi
          find neogpt -type f | wc -l

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: neogpt
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Collect the unsigned APK
        id: collect
        working-directory: neogpt
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+')
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "dist/NeoGPT-${VERSION}-unsigned.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "### NeoGPT $VERSION (versionCode $CODE) — unsigned" >> "$GITHUB_STEP_SUMMARY"
          ls -l dist

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: neogpt-unsigned-apk
          path: neogpt/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: neogpt-build-reports
          path: |
            neogpt/app/build/reports/**
            neogpt/build/reports/**
          if-no-files-found: ignore
