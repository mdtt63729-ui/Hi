services:
  gitofy:
    build: .
    env_file: .env
    ports: ["8080:8080"]
    volumes: ["./data:/app/data"]
    depends_on: [postgres,redis]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gitofy
      POSTGRES_USER: gitofy
      POSTGRES_PASSWORD: change-me
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
volumes:
  pgdata:
